<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facet Clock Widget</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      -webkit-app-region: drag;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    
    .widget-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      position: relative;
      background: rgba(20, 20, 24, 0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      animation: widgetSpawnFade 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes widgetSpawnFade {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    body:hover .widget-container {
      border-color: rgba(255, 255, 255, 0.22);
      cursor: grab;
    }

    body:active .widget-container {
      cursor: grabbing;
    }

    .widget-container.transparent-bg {
      background: transparent !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      border: none !important;
      box-shadow: none !important;
    }

    .widget-container.transparent-bg .widget-clock-stage {
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.85));
    }

    .widget-clock-stage {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .no-drag {
      -webkit-app-region: no-drag;
    }
  </style>
</head>
<body class="is-desktop-app is-widget-window">
  <div id="widget-container" class="widget-container">
    <div id="clock-stage" class="widget-clock-stage"></div>
  </div>

  <script src="js/themes.js"></script>
  <script src="js/renderers.js"></script>
  <script src="js/clock.js"></script>
  <script>
    (function() {
      const urlParams = new URLSearchParams(window.location.search);
      const widgetId = urlParams.get('id');

      function loadConfig() {
        try {
          const list = JSON.parse(localStorage.getItem('clock_pinned_widgets') || '[]');
          return list.find(w => w.id === widgetId) || null;
        } catch (e) {
          return null;
        }
      }

      function applyConfig(config) {
        if (!config || !config.customization) return;
        const cust = config.customization;
        
        if (typeof cust.opacity === 'number') {
          document.body.style.opacity = cust.opacity;
        }

        const container = document.getElementById('widget-container');
        if (container) {
          if (cust.transparentBg) {
            container.classList.add('transparent-bg');
          } else {
            container.classList.remove('transparent-bg');
          }
        }

        if (window.FacetClock) {
          if (cust.clockMode === 'digital') {
            window.FacetClock.setMode('digital');
          } else {
            window.FacetClock.setMode('analog');
          }
        }
      }

      window.addEventListener('DOMContentLoaded', () => {
        const cfg = loadConfig();
        applyConfig(cfg);

        if (window.electronAPI && window.electronAPI.onWidgetConfigUpdated) {
          window.electronAPI.onWidgetConfigUpdated((data) => {
            if (data && data.customization) {
              applyConfig({ customization: data.customization });
            }
          });
        }
      });
    })();
  </script>
</body>
</html>
